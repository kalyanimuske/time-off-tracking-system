<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Off</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Time Off</span>
      </div>
      <p class="company-name" id="company-name"></p>

      <label class="actor">
        <span class="actor-label">Viewing as</span>
        <select id="actor-select" aria-label="Switch user"></select>
        <span class="actor-meta" id="actor-meta"></span>
      </label>

      <nav id="nav" aria-label="Main"></nav>

      <div class="sidebar-foot">
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
        <button type="button" class="link-button" id="reset-demo">Reset demo data</button>
      </div>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
